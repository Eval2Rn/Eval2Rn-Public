[project]
name = "eval2rn-public"
version = "0.1.0"
description = "Data processing and modelling notebooks of the EVAL2Rn indoor radon prediction study"
authors = [{ name = "Diego Fraile" }, { name = "Frédéric Montet" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2.3,<3",
    "numpy==1.26.4",
    "geopandas>=1.0.1,<2",
    "shapely>=2.0.7",
    "pyproj>=3.7.1",
    "rasterio>=1.4.3,<2",
    "affine>=2.4.0",
    "fiona>=1.10.1",
    "ezdxf>=1.4.3",
    "openpyxl>=3.1.5,<4",
    "missingno>=0.5.2,<0.6",
    "scikit-learn>=1.7.2",
    "xgboost>=3.1.3",
    "catboost>=1.2.7,<2",
    "optuna>=4.2.1,<5",
    "scipy>=1.15.2",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = ["jupyterlab>=4.3.1,<5"]

[tool.uv]
package = false
